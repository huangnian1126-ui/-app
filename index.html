<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Bauhaus Ledger Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; user-select: none; box-sizing: border-box; }

        /* 强制锁定横向，防止左右滑动 */
        body, html { 
            margin: 0; padding: 0; 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: #F5F5F7; color: #1D1D1F; 
            width: 100vw; height: 100vh; 
            overflow-x: hidden; position: fixed;
        }
        
        .page { width: 100vw; height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
        .centered-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; max-width: 100vw; margin: 0 auto; }
        
        .spring-box {
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            will-change: transform;
        }
        .spring-box:active {
            transform: scale(0.95);
            transition: transform 0.05s ease-out;
        }

        .home-glass-card {
            width: 90%; background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 32px; padding: 10px 0;
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            margin: 0 auto;
        }
        .black-line { height: 1px; background: #000; opacity: 0.05; width: 85%; margin: 0 auto; }
        .stat-item { padding: 45px 0; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .stat-num { font-size: 38px; font-weight: 700; }
        .stat-label { font-size: 11px; font-weight: 600; margin-top: 12px; letter-spacing: 3px; color: #86868B; text-transform: uppercase; }

        /* 历史记录遮罩层，禁止横向溢出 */
        #historyOverlay { position: fixed; inset: 0; background: #F5F5F7; z-index: 150; display: none; flex-direction: column; overflow-y: auto; overflow-x: hidden; padding-top: 40px; }
        
        /* 新增：毛玻璃岛屿容器，将视图整体包裹并顶起来 */
        .glass-island {
            width: 92%; margin: 20px auto;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 38px;
            padding: 24px 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.02);
        }

        .calendar-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: 100%; }
        
        .box-cell { 
            background: rgba(255, 255, 255, 0.8);
            aspect-ratio: 1/1; display: flex; flex-direction: column; justify-content: center; align-items: center;
            border-radius: 22px; border: 1px solid rgba(255, 255, 255, 1); position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.01);
        }
        
        .cell-today { border: 1.5px solid #5B8DEF !important; background: #fff !important; box-shadow: 0 8px 20px rgba(91,141,239,0.1) !important; } 
        .box-date-label { font-size: 18px; font-weight: 600; }
        .box-amount-area-bottom { position: absolute; bottom: 10px; width: 100%; display: flex; justify-content: center; gap: 4px; font-size: 9px; font-weight: 500; transform: scale(0.85); }
        
        #statBar { width: 90%; padding: 0 10px; margin: 10px auto 100px; text-align: left; color: #86868B; line-height: 2; font-weight: 500; font-size: 13px; }

        #assetOverlay { position: fixed; inset: 0; background: #F5F5F7; z-index: 180; display: none; flex-direction: column; padding: 80px 24px 60px; overflow-x: hidden; }
        .asset-card { background: #fff; border-radius: 24px; padding: 35px 30px; margin-bottom: 20px; border: 1px solid #E5E5E7; width: 100%; }
        .asset-title { font-size: 12px; color: #86868B; font-weight: 600; letter-spacing: 2px; margin-bottom: 12px; }
        .asset-value { font-size: 34px; font-weight: 700; }

        #detailOverlay { position: fixed; inset: 0; background: rgba(245,245,247,0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); z-index: 300; display: none; justify-content: center; align-items: center; }
        #detailPage { 
            position: absolute; 
            top: 10%; bottom: 10%; left: 20px; right: 20px;
            background: #fff; border-radius: 32px; 
            display: flex; flex-direction: column; 
            padding: 30px 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            overflow: hidden;
        }
        #detailList { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
        
        .detail-item { padding: 18px 0; border-bottom: 1px solid #F5F5F7; font-weight: 500; font-size: 15px; position: relative; transition: color 0.3s; }
        .detail-item.is-deleted { color: #D1D1D6 !important; text-decoration: line-through; }
        .detail-item.is-deleted span { color: #D1D1D6 !important; }

        #inputModal { position: fixed; inset: 0; background: #FFF; z-index: 400; display: none; flex-direction: column; align-items: center; padding-top: 60px; overflow-x: hidden; }
        .modal-handle { width: 45px; height: 4px; background: #000; border-radius: 2px; margin-bottom: 50px; }
        .modal-amount-row { display: flex; align-items: center; gap: 10px; margin-bottom: 40px; }
        #amountInput { font-size: 56px; font-weight: 700; color: #1D1D1F; text-align: center; width: 200px; background: transparent; outline: none; border: none; }
        .modal-btn-group { display: flex; width: 85%; gap: 12px; margin-bottom: 50px; }
        .modal-type-btn { flex: 1; padding: 16px 0; border: 2px solid #000 !important; border-radius: 14px !important; text-align: center; font-size: 16px; font-weight: 700; }
        .modal-type-btn.active { background: #000 !important; color: #FFF !important; }
        .modal-note-row { width: 80%; border-bottom: 2px solid #000; padding-bottom: 8px; }
        #noteInput { width: 100%; background: transparent; outline: none; border: none; text-align: center; font-size: 16px; }

        .add-btn { position: fixed; right: 30px; bottom: 40px; width: 56px; height: 56px; background: #000; border-radius: 16px; display: flex; align-items: center; justify-content: center; z-index: 100; box-shadow: 0 10px 20px rgba(0,0,0,0.15); }
        .add-btn svg { width: 24px; height: 24px; fill: #fff; }
        
        #hintToast { position: fixed; bottom: 15px; left: 0; width: 100%; text-align: center; color: #8E8E93; font-weight: 600; font-size: 11px; opacity: 0; transition: opacity 0.3s; z-index: 500; pointer-events: none; letter-spacing: 1px; }
    </style>
</head>
<body>
    <div class="page" id="pageHome">
        <div class="centered-content">
            <div class="home-glass-card">
                <div class="stat-item spring-box" onclick="handleDoubleClick('asset')">
                    <div><span class="stat-num" id="ui-balance">0</span><span class="ml-1 text-sm font-medium">元</span></div>
                    <span class="stat-label">钱包余额</span>
                </div>
                <div class="black-line"></div>
                <div class="stat-item spring-box" onclick="handleDoubleClick('main')">
                    <div><span class="stat-num" id="ui-month-spend">0</span><span class="ml-1 text-sm font-medium">元</span></div>
                    <span class="stat-label">本月支出</span>
                </div>
                <div class="black-line"></div>
                <div class="stat-item spring-box" onclick="handleDoubleClick('today_detail')">
                    <div><span class="stat-num" id="ui-day-spend">0</span><span class="ml-1 text-sm font-medium">元</span></div>
                    <span class="stat-label">今日支出</span>
                </div>
            </div>
        </div>
    </div>

    <div id="hintToast">再次点击确认</div>

    <div id="assetOverlay">
        <div class="asset-card">
            <div class="asset-title">当前余额</div>
            <div class="asset-value" id="asset-val-balance">¥ 0.00</div>
        </div>
        <div class="asset-card spring-box" onclick="handleDoubleClick('debt_edit')">
            <div class="asset-title">累计负债</div>
            <div class="asset-value text-red-500" id="asset-val-debt">¥ 0.00</div>
        </div>
    </div>

    <div id="historyOverlay">
        <div class="centered-content" style="justify-content: flex-start; overflow-x: hidden;">
            <div class="glass-island">
                <div id="historyContent"></div>
            </div>
            <div id="statBar"></div>
        </div>
    </div>

    <div id="detailOverlay" onclick="if(event.target===this) history.back()">
        <div id="detailPage">
            <div id="detailList"></div>
        </div>
    </div>

    <div id="inputModal">
        <div class="modal-handle" onclick="history.back()"></div>
        <div class="modal-amount-row">
            <input type="number" id="amountInput" placeholder="0">
            <span class="text-xl font-bold mt-4">元</span>
        </div>
        <div class="modal-btn-group">
            <div id="btn-expense" class="modal-type-btn active" onclick="setHomeType('expense')">支出</div>
            <div id="btn-income" class="modal-type-btn" onclick="setHomeType('income')">收入</div>
        </div>
        <div class="modal-note-row">
            <input type="text" id="noteInput" placeholder="备注...">
        </div>
    </div>

    <div class="add-btn spring-box" onclick="openModal('main')">
        <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
    </div>

    <script>
        const STORAGE_KEY = 'Bauhaus_Ledger_Final_v2';
        let db = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { balance: 0, debt: 0, logs: [] };
        let currentType = 'expense', viewState = 'months', clickTimer = null, lastClickId = null, activeEntrySource = 'main';
        let deleteClickCount = 0, deleteTimer = null, deleteTargetId = null;

        db.logs.forEach((l, i) => { if (!l.id) l.id = 'legacy_' + l.timestamp + '_' + i; });

        window.onload = () => { updateUI(); };

        function updateUI() {
            const now = new Date(), cm = now.getMonth(), ty = now.getFullYear(), today = now.getDate();
            let mS = 0, dS = 0;
            for(let i = 0; i < db.logs.length; i++) {
                const l = db.logs[i];
                if (!l.isDeleted && l.type === 'expense' && l.source !== 'debt') {
                    const dt = new Date(l.timestamp);
                    if (dt.getFullYear() === ty && dt.getMonth() === cm) {
                        mS += l.amount;
                        if (dt.getDate() === today) dS += l.amount;
                    }
                }
            }
            document.getElementById('ui-balance').innerText = db.balance.toLocaleString();
            document.getElementById('ui-month-spend').innerText = mS.toLocaleString();
            document.getElementById('ui-day-spend').innerText = dS.toLocaleString();
            document.getElementById('asset-val-balance').innerText = `¥ ${db.balance.toLocaleString(undefined, {minimumFractionDigits: 2})}`;
            document.getElementById('asset-val-debt').innerText = `¥ ${(db.debt || 0).toLocaleString(undefined, {minimumFractionDigits: 2})}`;
        }

        function renderMonths() {
            viewState = 'months';
            const ty = new Date().getFullYear(), tm = new Date().getMonth() + 1;
            const monthData = {};
            for(let i=1; i<=12; i++) monthData[i] = { exp: 0, inc: 0 };
            let yE = 0, yI = 0;
            for(let i = 0; i < db.logs.length; i++) {
                const l = db.logs[i];
                if (!l.isDeleted && l.source !== 'debt') {
                    const dt = new Date(l.timestamp);
                    if (dt.getFullYear() === ty) {
                        const m = dt.getMonth() + 1;
                        if (l.type === 'expense') { monthData[m].exp += l.amount; yE += l.amount; }
                        else { monthData[m].inc += l.amount; yI += l.amount; }
                    }
                }
            }
            let html = `<div class="calendar-grid">`;
            for (let i = 1; i <= 12; i++) {
                const exp = monthData[i].exp, inc = monthData[i].inc;
                const isFuture = i > tm;
                html += `<div class="box-cell spring-box ${i===tm?'cell-today':''}" onclick="${isFuture ? '' : `handleDoubleClick('month', ${i})`}" style="opacity:${isFuture ? '0.2' : '1'}"><div class="box-date-label">${i}月</div><div class="box-amount-area-bottom">${exp>0?`<span style="color:#86868B">支${exp.toFixed(0)}</span>`:''}${inc>0?`<span style="color:#5B8DEF">收${inc.toFixed(0)}</span>`:''}</div></div>`;
            }
            document.getElementById('historyContent').innerHTML = html + `</div>`;
            document.getElementById('statBar').innerHTML = `<div>年度支出合计：${yE.toFixed(2)} 元</div><div>年度收入合计：${yI.toFixed(2)} 元</div>`;
        }

        function renderDays(m) {
            viewState = 'days'; history.pushState({v:'days'}, '');
            const ty = new Date().getFullYear(), tm = new Date().getMonth()+1, td = new Date().getDate();
            const days = new Date(ty, m, 0).getDate();
            const dayData = {};
            for(let d=1; d<=days; d++) dayData[d] = { net: 0, count: 0 };
            let mE = 0, mI = 0;
            for(let i = 0; i < db.logs.length; i++) {
                const l = db.logs[i];
                if (!l.isDeleted && l.source !== 'debt') {
                    const dt = new Date(l.timestamp);
                    if (dt.getFullYear() === ty && dt.getMonth() + 1 === m) {
                        const d = dt.getDate();
                        if(l.type === 'expense') { dayData[d].net -= l.amount; mE += l.amount; }
                        else { dayData[d].net += l.amount; mI += l.amount; }
                        dayData[d].count++;
                    }
                }
            }
            let html = `<div class="calendar-grid" style="grid-template-columns:repeat(4,1fr)">`;
            for (let d = 1; d <= days; d++) {
                const net = dayData[d].net, count = dayData[d].count;
                const isFutureDay = (m === tm && d > td) || (m > tm);
                html += `<div class="box-cell spring-box ${m===tm&&d===td?'cell-today':''}" onclick="${isFutureDay ? '' : `handleDoubleClick('day', '${m}-${d}')`}" style="opacity:${isFutureDay ? '0.2' : '1'}"><div class="box-date-label" style="font-size:16px">${d}日</div><div class="box-amount-area-bottom" style="font-size:8px; color:${net>=0?'#5B8DEF':'#86868B'}">${count>0?net.toFixed(0):''}</div></div>`;
            }
            document.getElementById('historyContent').innerHTML = html + `</div>`;
            document.getElementById('statBar').innerHTML = `<div>本月支出合计：${mE.toFixed(2)} 元</div><div>本月收入合计：${mI.toFixed(2)} 元</div>`;
        }

        function handleDoubleClick(type, id) {
            const currentId = type + (id || '');
            const hint = document.getElementById('hintToast');
            if (clickTimer && lastClickId === currentId) {
                clearTimeout(clickTimer); clickTimer = null; hint.style.opacity = '0';
                if(type==='asset'){document.getElementById('assetOverlay').style.display='flex';history.pushState({v:'asset'},'');}
                else if(type==='debt_edit'){openModal('debt');} 
                else if(type==='main'){document.getElementById('historyOverlay').style.display='flex';history.pushState({v:'months'},'');renderMonths();}
                else if(type==='month'){renderDays(id);}
                else if(type==='day'){const p=id.split('-'); showDetails(parseInt(p[0]), parseInt(p[1]));}
                else if(type==='today_detail'){showDetails(new Date().getMonth()+1, new Date().getDate());}
            } else {
                lastClickId = currentId; hint.style.opacity = '1';
                clickTimer = setTimeout(() => { hint.style.opacity = '0'; clickTimer = null; }, 2000);
            }
        }

        function openModal(source) {
            activeEntrySource = source;
            const btnEx = document.getElementById('btn-expense'), btnIn = document.getElementById('btn-income');
            if(source === 'debt') { btnEx.innerText = '还债'; btnIn.innerText = '借账'; } 
            else { btnEx.innerText = '支出'; btnIn.innerText = '收入'; }
            document.getElementById('inputModal').style.display='flex'; 
            history.pushState({v:'modal'},''); 
            setTimeout(()=>document.getElementById('amountInput').focus(),300); 
        }

        function saveLog() {
            const a = document.getElementById('amountInput'), n = document.getElementById('noteInput'), v = parseFloat(a.value);
            if(!v) return;
            if(activeEntrySource === 'debt') {
                const isBorrow = currentType === 'income';
                db.debt = (db.debt || 0) + (isBorrow ? v : -v);
                db.balance += (isBorrow ? v : -v);
            } else {
                db.balance += (currentType === 'income' ? v : -v);
            }
            db.logs.push({ 
                id: 'log_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                amount: v, type: currentType, source: activeEntrySource,
                note: (activeEntrySource==='debt'?'[负债] ':'') + n.value, 
                timestamp: Date.now(), 
                time: new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', hour12:false}),
                isDeleted: false
            });
            localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
            a.value = ''; n.value = ''; updateUI();
        }

        function setHomeType(t) { 
            currentType = t; 
            document.getElementById('btn-expense').className = `modal-type-btn ${t==='expense'?'active':''}`; 
            document.getElementById('btn-income').className = `modal-type-btn ${t==='income'?'active':''}`; 
        }

        function showDetails(m, d) {
            history.pushState({v:'detail'}, '');
            const logs = db.logs.filter(l => { let dt = new Date(l.timestamp); return dt.getMonth()+1 === m && dt.getDate() === d; });
            const listContainer = document.getElementById('detailList');
            if(logs.length === 0) {
                listContainer.innerHTML = "<div class='text-gray-300 text-center mt-10'>无记录</div>";
            } else {
                listContainer.innerHTML = logs.map(l => `
                    <div class="detail-item ${l.isDeleted ? 'is-deleted' : ''}" onclick="${l.isDeleted ? '' : `handleTripleClick(event, '${l.id}')`}">
                        ${l.time} ${l.type==='income'?(l.source==='debt'?'借账':'收入'):(l.source==='debt'?'还债':'支出')} 
                        <span style="color:${l.type==='expense'?'#FF3B30':'#5B8DEF'}">${l.type==='expense'?'-':'+'}${l.amount}</span>元
                        ${l.note?' ('+l.note+')':''}${l.isDeleted ? ' [已撤回]' : ''}
                    </div>`).join('');
            }
            document.getElementById('detailOverlay').style.display = 'flex';
        }

        function handleTripleClick(e, logId) {
            const hint = document.getElementById('hintToast');
            if (deleteTimer && deleteTargetId === logId) { deleteClickCount++; clearTimeout(deleteTimer); } 
            else { deleteClickCount = 1; deleteTargetId = logId; }
            if (deleteClickCount === 1) { hint.innerText = "再点 2 次撤回"; hint.style.opacity = '1'; } 
            else if (deleteClickCount === 2) { hint.innerText = "再点 1 次撤回"; hint.style.opacity = '1'; } 
            else if (deleteClickCount === 3) {
                hint.innerText = "已撤回"; executeSoftDelete(logId); deleteClickCount = 0;
                setTimeout(() => { hint.style.opacity = '0'; hint.innerText = "再次点击确认"; }, 1000);
                return;
            }
            deleteTimer = setTimeout(() => { deleteClickCount = 0; deleteTargetId = null; hint.style.opacity = '0'; setTimeout(() => { hint.innerText = "再次点击确认"; }, 300); }, 2000);
        }

        function executeSoftDelete(id) {
            const index = db.logs.findIndex(l => l.id === id);
            if (index > -1 && !db.logs[index].isDeleted) {
                const log = db.logs[index];
                if(log.source === 'debt') {
                    const isBorrow = log.type === 'income';
                    db.debt -= (isBorrow ? log.amount : -log.amount);
                    db.balance -= (isBorrow ? log.amount : -log.amount);
                } else {
                    db.balance -= (log.type === 'income' ? log.amount : -log.amount);
                }
                db.logs[index].isDeleted = true;
                localStorage.setItem(STORAGE_KEY, JSON.stringify(db));
                updateUI();
                const dt = new Date(log.timestamp);
                showDetails(dt.getMonth() + 1, dt.getDate()); 
            }
        }

        window.onpopstate = () => {
            if (document.getElementById('inputModal').style.display === 'flex') { saveLog(); document.getElementById('inputModal').style.display = 'none'; }
            else if (document.getElementById('detailOverlay').style.display === 'flex') { document.getElementById('detailOverlay').style.display = 'none'; }
            else if (document.getElementById('assetOverlay').style.display === 'flex') { document.getElementById('assetOverlay').style.display = 'none'; }
            else if (viewState === 'days') { renderMonths(); }
            else { document.getElementById('historyOverlay').style.display = 'none'; }
        };
    </script>
</body>
</html>
